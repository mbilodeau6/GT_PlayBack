<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="replay/replay.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Replay</h1>
            <div id="game-info">
                <div class="game-id-input-group">
                    <input type="text" id="game-id-input" placeholder="Game ID...">
                    <button id="btn-load-game" class="small-btn">Load</button>
                </div>
                <div id="playback-controls">
                    <button id="btn-restart" class="icon-btn playback-btn" title="Restart" disabled>
                        <i class="fa-solid fa-backward-fast"></i>
                    </button>
                    <button id="btn-step-back" class="icon-btn playback-btn" title="Step Back" disabled>
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button id="btn-play-pause" class="icon-btn playback-btn" title="Play/Pause" disabled>
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <button id="btn-step-forward" class="icon-btn playback-btn" title="Step Forward" disabled>
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                    <span id="playback-position"><span id="current-event">0</span> / <span id="total-events">0</span></span>
                </div>
            </div>
            <div class="header-buttons">
                <button id="btn-settings" class="icon-btn" title="Settings"><i class="fa-solid fa-gear"></i></button>
            </div>
        </header>

        <main>
            <div id="board-container">
                <div id="zoom-controls">
                    <button id="btn-zoom-in" title="Zoom In">+</button>
                    <span id="zoom-level">100%</span>
                    <button id="btn-zoom-out" title="Zoom Out">-</button>
                    <button id="btn-zoom-reset" title="Reset Zoom">Reset</button>
                </div>
                <svg id="board" viewBox="-400 -350 800 700"></svg>
                <div id="dice-display" class="hidden">
                    <span id="dice-1">-</span>
                    <span id="dice-2">-</span>
                </div>
            </div>

            <aside id="sidebar">
                <!-- Players Section -->
                <section id="players-section">
                    <h2>Players</h2>
                    <div id="players-list">
                        <div class="empty-state">Load a game to see players</div>
                    </div>
                </section>

                <!-- Event Detail Section -->
                <section id="event-detail-section">
                    <h2>Event Detail</h2>
                    <div id="event-detail">
                        <div class="empty-state">Select an event to see details</div>
                    </div>
                </section>

                <!-- Event Log Section -->
                <section id="events-section">
                    <h2>Event Log</h2>
                    <div id="events-list">
                        <div class="empty-state">No events to display</div>
                    </div>
                </section>
            </aside>
        </main>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Settings</h2>
                <p style="color: #aaa;">No configurable settings available.</p>
                <div class="button-group">
                    <button id="btn-cancel-settings">Close</button>
                </div>
            </div>
        </div>

        <!-- Error Modal -->
        <div id="error-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Error</h2>
                <p id="error-message"></p>
                <div class="button-group">
                    <button id="btn-close-error">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/hexmath.js"></script>
    <script src="js/board.js"></script>
    <script src="js/api.js"></script>
    <script src="replay/replay.js"></script>
</body>
</html>
